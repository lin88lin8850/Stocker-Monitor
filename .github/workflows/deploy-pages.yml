name: Build and Deploy Dashboard

on:
  push:
    branches: ["main", "master"]
    # data/ 由本 workflow 自动提交，不再触发自身（双保险，配合 GITHUB_TOKEN 防递归）。
    paths-ignore:
      - "data/**"
  workflow_dispatch:
  schedule:
    # 北京时间每天 07:00（UTC 23:00）跑一次；改时区只需调整这里的 cron。
    - cron: "0 23 * * *"

permissions:
  contents: write   # 需要 write 才能把更新后的 data/ 提交回仓库
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync latest financial data
        env:
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python update_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes; skipping commit."
          else
            git commit -m "chore: update data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Build static web page
        run: python build_web.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
